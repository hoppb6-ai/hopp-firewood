<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a4a26"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Firewood">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Hopp Firewood</title>
<style>
:root{--bg:#fbf5ec;--card:#fff;--wood:#7a4a26;--dark:#4a2a12;--lt:#f0e2cc;--acc:#c46a2b;--ok:#3d7a3a;--bad:#b23a2a}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip;touch-action:pan-y;max-width:100%}
body{font:16px/1.4 -apple-system,system-ui,Roboto,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--wood);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:18px;margin:0}#who{font-size:13px;opacity:.9}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:0;background:var(--wood);color:#fff;cursor:pointer}
button.sec{background:var(--lt);color:var(--dark)}button.bad{background:var(--bad)}button.sm{min-width:44px;padding:6px 10px}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px;border:1px solid #cdb79a;border-radius:8px;background:#fff;margin:4px 0 8px}
label{font-size:13px;font-weight:600}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#8a7560;font-size:13px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.paid{background:var(--ok)}.unpaid{background:var(--bad)}.del{background:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:#8a7560;border-radius:0;min-height:60px;font-size:12px;padding:4px}nav button.on{color:var(--wood);font-weight:700;border-top:3px solid var(--wood)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #eee}.r{text-align:right}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal>div{background:var(--bg);width:100%;max-width:720px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}
#print{display:none}
@media print{@page{size:letter;margin:.6in}body{background:#fff;padding:0}header,nav,main,#modal{display:none!important}#print{display:block!important;color:#000}}
</style></head><body>
<header><h1>🪵 Hopp Firewood</h1><span id="who"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="mbody"></div></div>
<div id="print"></div>
<script src="app.js"></script></body></html>
